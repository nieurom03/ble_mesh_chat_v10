name: ble_mesh_chat
description: BLE Mesh Chat v10 - real device discovery, connection approval and direct BLE chat
publish_to: "none"
version: 0.10.0+10

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  bluetooth_low_energy: ^6.2.1
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  cryptography: ^2.7.0
  uuid: ^4.5.1
  device_info_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
